<svg width="800" height="1200" viewBox="0 0 800 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="1200" fill="#F8F9FA"/>

  <!-- TITLE HEADER -->
  <g id="title-header">
    <text x="400" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#1A1A1A" text-anchor="middle">ANANTH AAHARA — APP WIREFRAME SPECIFICATION</text>
    <text x="400" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#666666" text-anchor="middle">Structural Layout • Grayscale Annotations • Editable Vector Layers</text>
  </g>

  <!-- MOBILE DEVICE FRAME -->
  <g id="mobile-device-frame">
    <rect x="200" y="100" width="400" height="1040" rx="36" fill="#FFFFFF" stroke="#222222" stroke-width="4"/>
    <!-- Speaker notch -->
    <rect x="350" y="112" width="100" height="6" rx="3" fill="#E0E0E0"/>
  </g>

  <!-- SECTION 1: NAVIGATION BAR -->
  <g id="section-navigation-bar">
    <rect x="216" y="136" width="368" height="64" rx="8" fill="#F4F4F4" stroke="#CCCCCC" stroke-width="1.5"/>
    <!-- Logo placeholder -->
    <g id="nav-logo">
      <rect x="232" y="148" width="40" height="40" rx="6" fill="#EAEAEA" stroke="#999999" stroke-width="1.5"/>
      <line x1="232" y1="148" x2="272" y2="188" stroke="#BBBBBB" stroke-width="1.5"/>
      <line x1="272" y1="148" x2="232" y2="188" stroke="#BBBBBB" stroke-width="1.5"/>
      <text x="282" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333333">Ananth Aahara</text>
    </g>
    <!-- Profile placeholder -->
    <g id="nav-profile">
      <circle cx="552" cy="168" r="18" fill="#EAEAEA" stroke="#999999" stroke-width="1.5"/>
      <circle cx="552" cy="163" r="6" fill="#999999"/>
      <path d="M542 178 C542 172, 546 170, 552 170 C558 170, 562 172, 562 178" stroke="#999999" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- SECTION 2: HERO SECTION -->
  <g id="section-hero">
    <rect x="216" y="214" width="368" height="236" rx="8" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1.5"/>
    <!-- Hero Text Block -->
    <g id="hero-text">
      <text x="232" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#111111">Ananth Aahara</text>
      <text x="232" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#444444">Authentic Indian Flavours</text>
      <text x="232" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666">Discover the taste of India with freshly</text>
      <text x="232" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666">prepared meals, traditional recipes, and</text>
      <text x="232" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666">flavours made to feel like home.</text>
    </g>
    <!-- Hero Image Placeholder -->
    <g id="hero-image-placeholder">
      <rect x="456" y="232" width="112" height="106" rx="8" fill="#E0E0E0" stroke="#999999" stroke-width="1.5"/>
      <line x1="456" y1="232" x2="568" y2="338" stroke="#BBBBBB" stroke-width="1.5"/>
      <line x1="568" y1="232" x2="456" y2="338" stroke="#BBBBBB" stroke-width="1.5"/>
      <text x="512" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#777777" text-anchor="middle">[Food Image]</text>
    </g>
    <!-- Search Bar -->
    <g id="hero-search-control">
      <rect x="232" y="380" width="336" height="46" rx="8" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
      <circle cx="254" cy="403" r="7" stroke="#777777" stroke-width="2" fill="none"/>
      <line x1="259" y1="408" x2="267" y2="416" stroke="#777777" stroke-width="2" stroke-linecap="round"/>
      <text x="276" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888888">Search dishes or categories...</text>
    </g>
  </g>

  <!-- SECTION 3: MENU BREAKDOWN (CATEGORIES) -->
  <g id="section-menu-categories">
    <rect x="216" y="464" width="368" height="98" rx="8" fill="#F8F8F8" stroke="#CCCCCC" stroke-width="1.5"/>
    <text x="232" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#222222" letter-spacing="1">ORDER YOUR FAVOURITES</text>
    
    <!-- Category Rectangular Buttons -->
    <g id="category-button-starters">
      <rect x="232" y="506" width="76" height="36" rx="8" fill="#444444" stroke="#444444" stroke-width="1.5"/>
      <text x="270" y="529" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Starters</text>
    </g>
    <g id="category-button-main-course">
      <rect x="316" y="506" width="94" height="36" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
      <text x="363" y="529" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#444444" text-anchor="middle">Main Course</text>
    </g>
    <g id="category-button-desserts">
      <rect x="418" y="506" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
      <text x="458" y="529" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#444444" text-anchor="middle">Desserts</text>
    </g>
    <g id="category-button-drinks">
      <rect x="506" y="506" width="66" height="36" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
      <text x="539" y="529" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#444444" text-anchor="middle">Drinks</text>
    </g>
  </g>

  <!-- SECTION 4: FOOD MENU LIST -->
  <g id="section-food-menu-list">
    <rect x="216" y="576" width="368" height="540" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
    
    <!-- Dish Row 1: Paneer Tikka -->
    <g id="dish-row-1">
      <text x="232" y="608" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#111111">Paneer Tikka</text>
      <text x="232" y="626" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666">Marinated paneer cubes grilled with spices...</text>
      <text x="232" y="648" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333333">₹220</text>
      <!-- Image box -->
      <rect x="504" y="594" width="66" height="66" rx="8" fill="#EAEAEA" stroke="#999999" stroke-width="1"/>
      <line x1="504" y1="594" x2="570" y2="660" stroke="#CCCCCC"/>
      <line x1="570" y1="594" x2="504" y2="660" stroke="#CCCCCC"/>
      <!-- Divider -->
      <line x1="232" y1="674" x2="568" y2="674" stroke="#E8E8E8" stroke-width="1"/>
    </g>

    <!-- Dish Row 2: Veg Samosa -->
    <g id="dish-row-2">
      <text x="232" y="702" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#111111">Veg Samosa</text>
      <text x="232" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666">Crispy pastry filled with spiced potatoes...</text>
      <text x="232" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333333">₹60</text>
      <rect x="504" y="688" width="66" height="66" rx="8" fill="#EAEAEA" stroke="#999999" stroke-width="1"/>
      <line x1="504" y1="688" x2="570" y2="754" stroke="#CCCCCC"/>
      <line x1="570" y1="688" x2="504" y2="754" stroke="#CCCCCC"/>
      <line x1="232" y1="768" x2="568" y2="768" stroke="#E8E8E8" stroke-width="1"/>
    </g>

    <!-- Dish Row 3: Masala Dosa -->
    <g id="dish-row-3">
      <text x="232" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#111111">Masala Dosa</text>
      <text x="232" y="814" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666">Golden crispy dosa filled with potato masala...</text>
      <text x="232" y="836" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333333">₹140</text>
      <rect x="504" y="782" width="66" height="66" rx="8" fill="#EAEAEA" stroke="#999999" stroke-width="1"/>
      <line x1="504" y1="782" x2="570" y2="848" stroke="#CCCCCC"/>
      <line x1="570" y1="782" x2="504" y2="848" stroke="#CCCCCC"/>
      <line x1="232" y1="862" x2="568" y2="862" stroke="#E8E8E8" stroke-width="1"/>
    </g>

    <!-- Dish Row 4: Paneer Butter Masala -->
    <g id="dish-row-4">
      <text x="232" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#111111">Paneer Butter Masala</text>
      <text x="232" y="908" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666">Soft paneer in creamy spiced tomato gravy...</text>
      <text x="232" y="930" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333333">₹240</text>
      <rect x="504" y="876" width="66" height="66" rx="8" fill="#EAEAEA" stroke="#999999" stroke-width="1"/>
      <line x1="504" y1="876" x2="570" y2="942" stroke="#CCCCCC"/>
      <line x1="570" y1="876" x2="504" y2="942" stroke="#CCCCCC"/>
      <line x1="232" y1="956" x2="568" y2="956" stroke="#E8E8E8" stroke-width="1"/>
    </g>

    <!-- Dish Row 5: Veg Biryani -->
    <g id="dish-row-5">
      <text x="232" y="984" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#111111">Veg Biryani</text>
      <text x="232" y="1002" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666">Fragrant basmati rice layered with veggies...</text>
      <text x="232" y="1024" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333333">₹190</text>
      <rect x="504" y="970" width="66" height="66" rx="8" fill="#EAEAEA" stroke="#999999" stroke-width="1"/>
      <line x1="504" y1="970" x2="570" y2="1036" stroke="#CCCCCC"/>
      <line x1="570" y1="970" x2="504" y2="1036" stroke="#CCCCCC"/>
      <line x1="232" y1="1050" x2="568" y2="1050" stroke="#E8E8E8" stroke-width="1"/>
    </g>

    <!-- Dish Row 6: Gulab Jamun -->
    <g id="dish-row-6">
      <text x="232" y="1078" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#111111">Gulab Jamun</text>
      <text x="232" y="1094" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666">Soft milk dumplings in sugar syrup...</text>
      <text x="232" y="1108" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333333">₹80</text>
      <rect x="504" y="1064" width="66" height="46" rx="8" fill="#EAEAEA" stroke="#999999" stroke-width="1"/>
    </g>
  </g>

  <!-- TEXT GUIDES AND ANNOTATIONS (LEFT AND RIGHT SIDES) -->
  <g id="annotations">
    <!-- Nav Bar Callout -->
    <line x1="80" y1="168" x2="216" y2="168" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="80" cy="168" r="4" fill="#555555"/>
    <text x="70" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#222222" text-anchor="end">NAVIGATION HEADER</text>
    <text x="70" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666" text-anchor="end">Logo + Profile Icon</text>

    <!-- Hero Section Callout -->
    <line x1="80" y1="320" x2="216" y2="320" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="80" cy="320" r="4" fill="#555555"/>
    <text x="70" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#222222" text-anchor="end">HERO SECTION</text>
    <text x="70" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666" text-anchor="end">Title, Subtitle, Description,</text>
    <text x="70" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666" text-anchor="end">Image &amp; Search Control</text>

    <!-- Menu Categories Callout -->
    <line x1="80" y1="510" x2="216" y2="510" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="80" cy="510" r="4" fill="#555555"/>
    <text x="70" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#222222" text-anchor="end">MENU BREAKDOWN</text>
    <text x="70" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666" text-anchor="end">Compact Rectangular</text>
    <text x="70" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666" text-anchor="end">Filter Buttons (6-10px radius)</text>

    <!-- Food Menu List Callout -->
    <line x1="80" y1="750" x2="216" y2="750" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="80" cy="750" r="4" fill="#555555"/>
    <text x="70" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#222222" text-anchor="end">FOOD MENU LIST</text>
    <text x="70" y="758" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666" text-anchor="end">Dish Name, Description,</text>
    <text x="70" y="772" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666" text-anchor="end">₹ Price, Right-Aligned Photo</text>

    <!-- Right Side Callout: Profile Action -->
    <line x1="584" y1="168" x2="680" y2="168" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="680" cy="168" r="4" fill="#555555"/>
    <text x="690" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#222222">PROFILE ACCESS</text>
    <text x="690" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666">Opens Profile Screen</text>

    <!-- Right Side Callout: Search Filter -->
    <line x1="584" y1="403" x2="680" y2="403" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="680" cy="403" r="4" fill="#555555"/>
    <text x="690" y="399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#222222">SEARCH CONTROL</text>
    <text x="690" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666">Live Filter by Name &amp; Desc</text>

    <!-- Right Side Callout: Category Action -->
    <line x1="584" y1="524" x2="680" y2="524" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="680" cy="524" r="4" fill="#555555"/>
    <text x="690" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#222222">CATEGORY FILTER</text>
    <text x="690" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666">Instant Menu List Update</text>

    <!-- Right Side Callout: Scrollable List -->
    <line x1="584" y1="800" x2="680" y2="800" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="680" cy="800" r="4" fill="#555555"/>
    <text x="690" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#222222">FLATLIST SCROLL</text>
    <text x="690" y="812" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666666">Smooth Vertical Scrolling</text>
  </g>
</svg>
